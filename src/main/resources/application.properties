spring.application.name=Online-System

# Database connection setup
# Using in-memory H2 database, nothing will be retained after application shutdown
spring.datasource.url=jdbc:h2:mem:ear-online-system
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=ear-online-system
spring.datasource.password=ear-online-system

# Json Config
spring.jackson.default-property-inclusion=non_null

# Additional database-access specifics
#spring.jpa.generate-ddl=true
spring.jpa.show-sql=false
# h2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Database platform configuration for JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Load data from data-h2.sql
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-h2.sql
